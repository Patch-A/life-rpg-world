<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>屏幕诊断</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;padding:16px;background:#12101f;color:#eee6ff;font:16px/1.6 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}
  h1{font-size:19px;margin:0 0 4px}
  p.lead{margin:0 0 16px;color:#a99fc4;font-size:14px}
  table{width:100%;border-collapse:collapse;margin-bottom:16px}
  td{padding:9px 6px;border-bottom:1px solid #ffffff14;vertical-align:top;font-size:15px}
  td:first-child{color:#a99fc4;width:44%}
  b{font-variant-numeric:tabular-nums;font-size:17px}
  .ok{color:#67dfb5}.bad{color:#ff8b8b}
  .box{border:2px dashed #b89fff55;border-radius:12px;padding:12px;margin:14px 0;font-size:14px;color:#c9bde8}
  .box b{display:block;font-size:20px;color:#fff;margin-bottom:4px}
  .fill{width:100%;height:44px;border-radius:10px;border:0;background:#b89fff;color:#1a1530;font-size:16px;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<h1>屏幕诊断</h1>
<p class="lead">把这个页面在手机上打开，把整页截一张图发回来。</p>

<div class="box">
  页面报告的 CSS 宽度
  <b id="w">…</b>
  <span id="verdict">正在检测…</span>
</div>

<table id="t"></table>

<div class="box">
  下面这条线如果正好贴满屏幕左右边缘，说明布局宽度 = 屏幕宽度；<br>
  如果两侧留白很多，说明浏览器在用更宽的「桌面宽度」渲染。
  <div style="height:14px;background:linear-gradient(90deg,#b89fff,#67dfb5);border-radius:7px;margin-top:10px"></div>
</div>

<script>
(function(){
  var px = function(n){ return Math.round(n*100)/100; };
  var rows = [
    ['window.innerWidth', px(window.innerWidth), '布局视口宽度（CSS px）'],
    ['window.innerHeight', px(window.innerHeight), '布局视口高度'],
    ['devicePixelRatio', px(window.devicePixelRatio), '物理像素 ÷ CSS 像素'],
    ['screen.width', screen.width, '屏幕 CSS 宽度'],
    ['screen.height', screen.height, ''],
    ['visualViewport.width', window.visualViewport ? px(window.visualViewport.width) : '不支持', '看得见的宽度'],
    ['visualViewport.scale', window.visualViewport ? px(window.visualViewport.scale) : '不支持', '1 = 没缩放'],
    ['matchMedia(max-width:760px)', matchMedia('(max-width:760px)').matches ? '是' : '否', '手机样式开关'],
    ['matchMedia(max-width:1050px)', matchMedia('(max-width:1050px)').matches ? '是' : '否', ''],
    ['viewport meta 内容', (document.querySelector('meta[name=viewport]')||{}).content || '没有', ''],
    ['userAgent', navigator.userAgent, '']
  ];
  var t = document.getElementById('t');
  rows.forEach(function(r){
    var tr = document.createElement('tr');
    var a = document.createElement('td'); a.textContent = r[0];
    var b = document.createElement('td');
    b.innerHTML = '<b>'+String(r[1])+'</b>' + (r[2] ? '<br><span style="color:#8f86ab;font-size:13px">'+r[2]+'</span>' : '');
    tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
  });

  var w = window.innerWidth;
  document.getElementById('w').textContent = w + ' px';
  var v = document.getElementById('verdict');
  if (w <= 420) { v.className = 'ok'; v.textContent = '✓ 正常：布局宽度等于手机宽度'; }
  else { v.className = 'bad'; v.textContent = '✗ 异常：手机宽度约 360–420，却在按 ' + w + 'px 排版'; }
})();
</script>
</body>
</html>
