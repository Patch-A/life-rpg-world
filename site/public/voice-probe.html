<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音能力探针</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:18px 16px 60px;background:#090d1b;color:#edf0ff;
  font:16px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  max-width:720px;margin:auto}
h1{font-size:1.25rem;margin:0 0 6px}
p.lead{color:#909bb7;font-size:.86rem;margin:0 0 20px}
.row{display:flex;align-items:flex-start;gap:11px;border:1px solid #ffffff12;border-radius:13px;
  padding:13px 15px;margin-bottom:10px;background:#101628}
.mark{width:22px;flex-shrink:0;text-align:center;font-weight:700}
.ok .mark{color:#6ddcae}
.no .mark{color:#ff8fa3}
.mid .mark{color:#ffc978}
.wait .mark{color:#8891ab}
.body{flex:1;min-width:0}
.name{font-size:.92rem;display:block}
.detail{font-size:.78rem;color:#8c96b1;word-break:break-word;margin-top:3px}
button{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:13px;
  background:linear-gradient(120deg,#bfaaff,#987be8);color:#181129;font:inherit;font-weight:600}
button:disabled{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;font-size:.74rem;color:#9aa4c0;
  background:#0d1326;border-radius:11px;padding:12px;margin-top:16px}
</style>

<h1>语音能力探针</h1>
<p class="lead">只在这台设备上测「能不能」，不连任何模型、不发任何数据。结果仅供参考，可以截图发回来。</p>

<div id="list"></div>
<button id="go">开始检测</button>
<button id="mic" style="background:#1a2137;color:#c9cfe5;border:1px solid #ffffff13">单独测：麦克风与录音</button>
<pre id="log" hidden></pre>

<script>
const list = document.getElementById('list');
const log = document.getElementById('log');
const lines = [];

function add(state, name, detail) {
  const row = document.createElement('div');
  row.className = 'row ' + state;
  row.innerHTML = `<span class="mark">${state === 'ok' ? '✓' : state === 'no' ? '✗' : state === 'mid' ? '!' : '…'}</span>
    <span class="body"><span class="name">${name}</span>${detail ? `<span class="detail">${detail}</span>` : ''}</span>`;
  list.appendChild(row);
  return row;
}

function note(s) { lines.push(s); log.hidden = false; log.textContent = lines.join('\n'); }

async function probe() {
  list.innerHTML = '';
  lines.length = 0;

  // 1. 安全上下文：不是 https/localhost 的话，麦克风和 AudioWorklet 都可能被禁。
  const secure = window.isSecureContext;
  add(secure ? 'ok' : 'no', '安全上下文',
    secure ? location.origin : `${location.origin} —— 只有 https 或 localhost 才算。这个地址下麦克风多半用不了。`);

  // 2. WebAudio：流式播放 PCM 全靠它。
  const AC = window.AudioContext || window.webkitAudioContext;
  add(AC ? 'ok' : 'no', 'AudioContext', AC ? (window.AudioContext ? '标准构造器' : '只有 webkit 前缀') : '没有，流式播放无从谈起');

  // 3. AudioWorklet：实时采集/播放要用它；没有的话只能退到 ScriptProcessor（已废弃但仍可用）。
  if (AC) {
    // 注意：`AudioContext.prototype.audioWorklet` 是个 getter，读 prototype 上的它会抛
    // 「Illegal invocation」（它要求 this 是真实例）。第一版就在这里静默挂掉，
    // 整个检测只出两行、不报错——能力判断只能问实例，不能问原型。
    const ctx = new AC();
    const real = !!(ctx.audioWorklet && typeof AudioWorkletNode !== 'undefined');
    add(real ? 'ok' : 'mid', 'AudioWorklet',
      real ? `可用（采样率 ${ctx.sampleRate}Hz）` : '没有。可以退到 ScriptProcessor，延迟会大一些');
    note(`sampleRate=${ctx.sampleRate} baseLatency=${ctx.baseLatency ?? 'n/a'} outputLatency=${ctx.outputLatency ?? 'n/a'}`);
    ctx.close();
  }

  // 4. 真的放一段声音出来：能建 AudioContext ≠ 能出声。
  if (AC) {
    const row = add('wait', '实际播放一段音频', '正在尝试…');
    try {
      const ctx = new AC();
      // resume() 在没有用户手势时可能**永远不 resolve**（不是 reject）。
      // 不设超时的话整个检测会卡死在这一步——第一版就卡在这儿，只出来两行。
      await Promise.race([ctx.resume(), new Promise(r => setTimeout(r, 2500))]);
      // 0.35 秒 440Hz 正弦，走 AudioBufferSourceNode —— 和流式播放是同一条路径。
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.35), ctx.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.sin(2 * Math.PI * 440 * i / ctx.sampleRate) * 0.18;
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(ctx.destination); src.start();
      row.className = 'row ok';
      row.innerHTML = `<span class="mark">✓</span><span class="body"><span class="name">实际播放一段音频</span>
        <span class="detail">刚刚应该响了一声 0.35 秒的短音。没听见就点一下屏幕再来一次（部分浏览器要先有手势）。context.state=${ctx.state}</span></span>`;
      await new Promise(r => { src.onended = r; setTimeout(r, 1500); });
      ctx.close();
    } catch (e) {
      row.className = 'row no';
      row.innerHTML = `<span class="mark">✗</span><span class="body"><span class="name">实际播放一段音频</span>
        <span class="detail">${String(e && e.message || e)}</span></span>`;
    }
  }

  // 5. MediaStream 播放：如果服务端推的是编码过的音频流（如 mp3/opus 分片），走这个。
  add(window.MediaSource || window.ManagedMediaSource ? 'ok' : 'no', 'MediaSource（分片流播放）',
    window.MediaSource ? `可用，支持 ${(MediaSource.isTypeSupported('audio/mpeg') ? 'audio/mpeg ' : '')}${(MediaSource.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus ' : '')}`.trim()
      : '没有。只能整段下载后解码再播，首声延迟会变大');

  // 6. WebSocket：实时语音几乎一定要它。这里只测握手，不发内容。
  const row = add('wait', 'WebSocket 握手', '正在连本地 echo…');
  try {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/__no_such_ws__`);
    const result = await new Promise(res => {
      const t = setTimeout(() => res('timeout'), 4000);
      ws.onopen = () => { clearTimeout(t); res('open'); };
      ws.onerror = () => { clearTimeout(t); res('error'); };
      ws.onclose = e => { clearTimeout(t); res('close:' + e.code); };
    });
    ws.close();
    // 这个地址本来就没有 WS 端点，所以「能连上后立刻关闭/报错」恰恰说明 WebSocket 本身可用。
    const ok = result !== 'timeout';
    row.className = 'row ' + (ok ? 'ok' : 'no');
    row.innerHTML = `<span class="mark">${ok ? '✓' : '✗'}</span><span class="body">
      <span class="name">WebSocket 握手</span>
      <span class="detail">${ok
        ? `浏览器支持并尝试了连接（${result}）。没有端点所以必然失败，这是预期的。`
        : '4 秒没有反应。可能是浏览器限制，也可能是网络层拦了升级请求。'}</span></span>`;
  } catch (e) {
    row.className = 'row no';
    row.innerHTML = `<span class="mark">✗</span><span class="body"><span class="name">WebSocket 握手</span>
      <span class="detail">${String(e && e.message || e)}</span></span>`;
  }

  // 7. 已知在这台机器上缺失的两项，一起记录下来省得再问。
  add(typeof speechSynthesis !== 'undefined' ? 'ok' : 'no', 'speechSynthesis（本机朗读）',
    typeof speechSynthesis !== 'undefined' ? '存在' : '不存在——上一次真机验收已经确认过');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  add(SR ? 'ok' : 'no', 'SpeechRecognition（浏览器语音识别）',
    SR ? '存在。但它走境外服务器，国内网络经常报 network 错' : '不存在');
}

document.getElementById('go').onclick = () => { probe(); };

// 麦克风单独一个按钮：它会弹系统权限框，混在整套检测里容易让人以为整个页面卡住了。
document.getElementById('mic').onclick = async () => {
  const row = add('wait', '麦克风与录音', '正在申请权限…');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const track = stream.getAudioTracks()[0];
    const settings = track.getSettings ? track.getSettings() : {};
    const hasRecorder = typeof MediaRecorder !== 'undefined';
    let mime = '未知';
    if (hasRecorder) {
      for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
        if (MediaRecorder.isTypeSupported(m)) { mime = m; break; }
      }
    }
    const hasWorkletMic = !!(window.AudioContext && AudioContext.prototype.audioWorklet);
    add(hasRecorder ? 'ok' : 'mid', 'MediaRecorder（录成文件）',
      hasRecorder ? `可用，最合适的容器：${mime}` : '没有。可以退到 AudioWorklet 直接拿 PCM');
    add('ok', '麦克风轨道', `${track.label || '无名设备'} · ${settings.sampleRate || '?'}Hz · echoCancellation=${settings.echoCancellation}`);
    row.className = 'row ok';
    row.innerHTML = `<span class="mark">✓</span><span class="body"><span class="name">麦克风与录音</span>
      <span class="detail">拿到麦克风了。这条路在真机上本来就通（按住说话已经验证过）。</span></span>`;
    stream.getTracks().forEach(t => t.stop());
    note(`mic: ${JSON.stringify(settings)} recorder=${hasRecorder} mime=${mime} worklet=${hasWorkletMic}`);
  } catch (e) {
    row.className = 'row no';
    row.innerHTML = `<span class="mark">✗</span><span class="body"><span class="name">麦克风与录音</span>
      <span class="detail">${e && e.name}：${String(e && e.message || e)}</span></span>`;
  }
};
</script>
</html>
